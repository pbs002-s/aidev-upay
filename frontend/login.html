<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | RemitMind by upay</title>
  <meta name="description" content="Secure login and registration portal for RemitMind by upay. One-click demo access for senders, receivers, agents, and analysts.">

  <!-- Google Fonts: Inter & Archivo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, #7388f6 0%, #5d72e4 45%, #4b58c7 100%);
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 65%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Top Back Navigation */
    .top-nav {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 100;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.28);
      color: #ffffff;
      transform: translateX(-2px);
    }

    /* Main Login Card */
    .auth-card-container {
      width: 940px;
      max-width: 100%;
      min-height: 560px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 65px rgba(22, 28, 77, 0.28);
      overflow: hidden;
      display: flex;
      position: relative;
      z-index: 10;
      transition: all 0.4s ease;
    }

    /* Left Promo Panel (Blue Wave) */
    .panel-side {
      width: 44%;
      background: #5d72e4;
      background: linear-gradient(135deg, #647bf0 0%, #5d72e4 60%, #4a5fd4 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 36px;
      text-align: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    /* Elegant curved wave overlay matching image */
    .panel-side-wave {
      position: absolute;
      top: 0;
      right: -2px;
      bottom: 0;
      width: 90px;
      height: 100%;
      pointer-events: none;
    }

    .panel-side-content {
      position: relative;
      z-index: 3;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .panel-side-title {
      font-family: 'Archivo', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -0.01em;
    }

    .panel-side-desc {
      font-size: 0.95rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 28px;
    }

    .panel-side-btn {
      background: transparent;
      border: 2px solid #ffffff;
      color: #ffffff;
      border-radius: 9999px;
      padding: 10px 42px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    .panel-side-btn:hover {
      background: #ffffff;
      color: #5d72e4;
      transform: scale(1.04);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    /* Right Form Panel */
    .panel-form {
      width: 56%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 48px;
      position: relative;
      z-index: 1;
    }

    .form-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-title {
      font-family: 'Archivo', sans-serif;
      font-size: 2.3rem;
      font-weight: 700;
      color: #2b303a;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    /* Pill-shaped Input Fields */
    .input-pill-group {
      width: 100%;
      margin-bottom: 16px;
      position: relative;
    }

    .input-pill {
      width: 100%;
      height: 50px;
      background: #f0f2f5;
      border-radius: 9999px;
      border: 1px solid transparent;
      padding: 0 20px 0 48px;
      font-size: 0.95rem;
      color: #333d4b;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-pill:focus {
      background: #ffffff;
      border-color: #5d72e4;
      box-shadow: 0 0 0 4px rgba(93, 114, 228, 0.15);
    }

    .input-pill::placeholder {
      color: #9aa5b5;
    }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #8b96a5;
      pointer-events: none;
    }

    /* Primary Action Button */
    .btn-action {
      background: #5d72e4;
      color: #ffffff;
      border: none;
      height: 48px;
      padding: 0 46px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 24px;
      box-shadow: 0 6px 20px rgba(93, 114, 228, 0.4);
      transition: all 0.25s ease;
      outline: none;
    }

    .btn-action:hover {
      background: #4c61d8;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(93, 114, 228, 0.5);
    }

    .btn-action:active {
      transform: translateY(0);
    }

    /* Social Platforms Divider */
    .social-divider {
      color: #8c97a8;
      font-size: 0.84rem;
      margin-bottom: 16px;
      text-align: center;
    }

    /* Social Icon Buttons */
    .social-buttons {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #e1e6ee;
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #4b5563;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .social-btn:hover {
      border-color: #5d72e4;
      color: #5d72e4;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(93, 114, 228, 0.18);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Quick Demo Login Bar ("add demo") */
    .demo-bar-container {
      margin-top: 28px;
      width: 940px;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      position: relative;
      z-index: 10;
    }

    .demo-bar-label {
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .demo-badge-flash {
      background: #ffe8b8;
      color: #1e293b;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .demo-personas-grid {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .demo-persona-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 6px 14px;
      border-radius: 9999px;
      color: #2b303a;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-decoration: none;
    }

    .demo-persona-card:hover {
      background: #ffffff;
      color: #5d72e4;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      border-color: #5d72e4;
    }

    .demo-persona-role {
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 500;
    }

    /* Responsive Breakpoint */
    @media (max-width: 820px) {
      .auth-card-container {
        flex-direction: column;
        width: 100%;
        max-width: 440px;
        min-height: auto;
      }

      .panel-side {
        width: 100%;
        padding: 36px 24px;
      }

      .panel-side-wave {
        display: none;
      }

      .panel-form {
        width: 100%;
        padding: 36px 24px;
      }

      .demo-bar-container {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      background: #1e293b;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Left Back to Home -->
  <div class="top-nav">
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back to RemitMind</span>
    </a>
  </div>

  <!-- Main Split Auth Card -->
  <div class="auth-card-container" id="auth-container">
    
    <!-- Left Section: "New here?" (with organic wave shape divider) -->
    <div class="panel-side" id="panel-left">
      <!-- Organic SVG Wave Divider connecting to white right panel -->
      <svg class="panel-side-wave" viewBox="0 0 100 500" preserveAspectRatio="none">
        <path d="M0,0 C65,120 95,240 50,340 C15,420 50,480 100,500 L100,0 Z" fill="#ffffff"></path>
      </svg>

      <div class="panel-side-content">
        <h2 class="panel-side-title" id="side-title">New here?</h2>
        <p class="panel-side-desc" id="side-desc">
          Join us today and discover a world of possibilities. Create your account in seconds!
        </p>
        <button class="panel-side-btn" id="btn-toggle-mode" onclick="toggleAuthMode()">SIGN UP</button>
      </div>
    </div>

    <!-- Right Section: "Sign in" Form -->
    <div class="panel-form" id="panel-right">
      <div class="form-wrapper">
        <h1 class="form-title" id="form-title">Sign in</h1>

        <form id="auth-form" onsubmit="handleAuthSubmit(event)">
          <!-- Name field (shown only in Sign up mode) -->
          <div class="input-pill-group" id="group-name" style="display: none;">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="auth-name" class="input-pill" placeholder="Full Name">
          </div>

          <!-- Email Input -->
          <div class="input-pill-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="auth-email" class="input-pill" placeholder="Email" required value="rahim.sheikh@upay.com.bd">
          </div>

          <!-- Password Input -->
          <div class="input-pill-group">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="auth-password" class="input-pill" placeholder="Password" required value="••••••••">
          </div>

          <!-- Action Button -->
          <button type="submit" class="btn-action" id="btn-submit">LOGIN</button>
        </form>

        <!-- Social Platforms -->
        <p class="social-divider" id="social-label">Or sign in with social platforms</p>
        <div class="social-buttons">
          <!-- Google -->
          <button type="button" class="social-btn" onclick="socialLogin('Google')" title="Sign in with Google">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
          </button>
          <!-- Facebook -->
          <button type="button" class="social-btn" onclick="socialLogin('Facebook')" title="Sign in with Facebook">
            <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </button>
          <!-- Twitter / X -->
          <button type="button" class="social-btn" onclick="socialLogin('Twitter / X')" title="Sign in with Twitter / X">
            <svg viewBox="0 0 24 24" fill="#1DA1F2"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.936 9.936 0 0024 4.59z"/></svg>
          </button>
          <!-- LinkedIn -->
          <button type="button" class="social-btn" onclick="socialLogin('LinkedIn')" title="Sign in with LinkedIn">
            <svg viewBox="0 0 24 24" fill="#0A66C2"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Demo Login Bar ("add demo") -->
  <div class="demo-bar-container">
    <div class="demo-bar-label">
      <span class="demo-badge-flash">⚡ One-Click Demo</span>
      <span>Instant Test Personas:</span>
    </div>

    <div class="demo-personas-grid">
      <!-- Rahim (Sender) -->
      <button type="button" class="demo-persona-card" onclick="loginAsDemo('sender', 'Rahim Sheikh', 'rahim@upay.com.bd')">
        <span>👤 Rahim (UAE Sender)</span>
        <span class="demo-persona-role">corridor: AED_BDT</span>
      </button>

      <!-- Amina (Receiver) -->
      <button type="button" class="demo-persona-card" onclick="loginAsDemo('receiver', 'Amina Begum', 'amina@upay.com.bd')">
        <span>👩 Amina (Receiver)</span>
        <span class="demo-persona-role">Sylhet District</span>
      </button>

      <!-- Faruk (Agent) -->
      <button type="button" class="demo-persona-card" onclick="loginAsDemo('agent', 'Faruk Hossain', 'faruk.agent@upay.com.bd')">
        <span>🏪 Faruk (Agent)</span>
        <span class="demo-persona-role">Cash Liquidity</span>
      </button>

      <!-- Tariq (Analyst) -->
      <button type="button" class="demo-persona-card" onclick="loginAsDemo('analyst', 'Tariq Ahmed', 'tariq.risk@upay.com.bd')">
        <span>🛡️ Tariq (Risk Analyst)</span>
        <span class="demo-persona-role">SAR & AML Review</span>
      </button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toast">
    <span id="toast-text">Authentication successful!</span>
  </div>

  <script>
    let isSignUpMode = false;

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;

      const sideTitle = document.getElementById('side-title');
      const sideDesc = document.getElementById('side-desc');
      const sideBtn = document.getElementById('btn-toggle-mode');
      const formTitle = document.getElementById('form-title');
      const btnSubmit = document.getElementById('btn-submit');
      const groupName = document.getElementById('group-name');
      const socialLabel = document.getElementById('social-label');

      if (isSignUpMode) {
        sideTitle.innerText = "One of us?";
        sideDesc.innerText = "To keep connected with your remittances, please sign in with your personal credentials.";
        sideBtn.innerText = "SIGN IN";

        formTitle.innerText = "Create Account";
        btnSubmit.innerText = "SIGN UP";
        groupName.style.display = "block";
        socialLabel.innerText = "Or sign up with social platforms";
      } else {
        sideTitle.innerText = "New here?";
        sideDesc.innerText = "Join us today and discover a world of possibilities. Create your account in seconds!";
        sideBtn.innerText = "SIGN UP";

        formTitle.innerText = "Sign in";
        btnSubmit.innerText = "LOGIN";
        groupName.style.display = "none";
        socialLabel.innerText = "Or sign in with social platforms";
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const role = email.includes('risk') ? 'analyst' : (email.includes('agent') ? 'agent' : (email.includes('amina') ? 'receiver' : 'sender'));
      
      showToast(`Welcome! Signing in to RemitMind as ${email}...`);
      setTimeout(() => {
        window.location.href = `app.html?persona=${role}&email=${encodeURIComponent(email)}`;
      }, 1000);
    }

    function loginAsDemo(role, name, email) {
      document.getElementById('auth-email').value = email;
      document.getElementById('auth-password').value = '••••••••';
      
      showToast(`⚡ Demo Login Activated: Signed in as ${name} (${role.toUpperCase()})`);
      setTimeout(() => {
        window.location.href = `app.html?persona=${role}`;
      }, 800);
    }

    function socialLogin(provider) {
      showToast(`Connecting via ${provider} OAuth... Signing into RemitMind Demo`);
      setTimeout(() => {
        window.location.href = `app.html?persona=sender`;
      }, 900);
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = text;
      toast.style.display = 'flex';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3500);
    }
  </script>
</body>
</html>
